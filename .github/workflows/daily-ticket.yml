name: Daily Football Ticket

on:
  schedule:
    # 04:23 UTC = 06:23 Central European Summer Time (05:23 in winter).
    # GitHub delays scheduled runs, especially at the top of the hour; the old
    # 07:00 UTC slot started 5-8 hours late (12:00-15:00 UTC). An early, off-peak
    # minute leaves room for that delay so the email lands before kickoffs.
    - cron: "23 4 * * *"
  workflow_dispatch: {}

jobs:
  ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and email the daily ticket
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
        run: python3 main.py

      - name: Save ticket as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket
          path: tickets/
          if-no-files-found: ignore
