name: Daily Football Ticket

# TEMPORARY copy used only to download match history from a throwaway branch (GitHub
# only runs workflow files that already exist on main). It never runs main.py and has
# no email secrets. This branch must never be merged.
on:
  workflow_dispatch:
    inputs:
      seasons:
        description: "Season start years, space separated"
        type: string
        default: "2024 2025 2026"
      dry_run:
        description: "unused here"
        type: boolean
        default: true

jobs:
  ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download results from football-data.org
        env:
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          SEASONS: ${{ inputs.seasons }}
        run: python3 tools/fetch_history.py history $SEASONS

      - name: Keep the data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: history
          path: history/
          retention-days: 7
          if-no-files-found: ignore
