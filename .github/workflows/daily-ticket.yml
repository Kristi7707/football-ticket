name: Daily Football Ticket

on:
  # No `schedule:` on purpose. GitHub delays scheduled runs under load (this one
  # started 5-8 hours late), so the daily run is started at exactly 13:00
  # Europe/Tirane by an external timer calling the workflow_dispatch API.
  # See "Daily automation" in the README. Do not add a cron here as well, or the
  # ticket would be emailed twice.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Analyze and log only - do not send any email"
        type: boolean
        default: false

jobs:
  ticket:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and email the daily ticket
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          EMAIL_USERNAME: ${{ secrets.EMAIL_USERNAME }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          # Empty when the timer starts the run through the API without inputs.
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            python3 main.py --dry-run
          else
            python3 main.py
          fi

      - name: Save ticket as run artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ticket
          path: tickets/
          if-no-files-found: ignore
